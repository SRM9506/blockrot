<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BLOCKROT — 3D Zombie Survival</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;overflow:hidden;background:#0a0c10;font-family:'Courier New',monospace;}
  canvas{display:block;}

  /* crosshair (centered, in-game only) */
  #reticle{position:fixed;left:50%;top:50%;width:24px;height:24px;pointer-events:none;z-index:20;
    transform:translate(-50%,-50%);mix-blend-mode:screen;opacity:0;transition:opacity .15s;}
  #reticle.show{opacity:1;}
  #reticle::before,#reticle::after{content:'';position:absolute;background:#e8e2d0;}
  #reticle::before{left:11px;top:0;width:2px;height:24px;}
  #reticle::after{top:11px;left:0;height:2px;width:24px;}
  #reticle.hot::before,#reticle.hot::after{background:#ff3d2e;}
  #reticle .dot{position:absolute;left:50%;top:50%;width:3px;height:3px;border-radius:50%;
    background:#ff3d2e;transform:translate(-50%,-50%);}

  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;color:#e8e2d0;opacity:0;transition:opacity .2s;}
  #hud.show{opacity:1;}
  .top{position:absolute;top:14px;left:0;right:0;display:flex;gap:10px;justify-content:center;}
  .stat{background:rgba(10,14,18,.72);border:1px solid rgba(255,255,255,.09);border-radius:6px;
    padding:6px 14px;font-size:12px;letter-spacing:.14em;font-weight:700;}
  .stat b{color:#ffd15c;font-size:16px;margin-left:6px;}
  .stat.kills b{color:#ff6b5c;}
  #wavebanner{position:absolute;top:42%;left:0;right:0;text-align:center;font-size:52px;font-weight:700;
    letter-spacing:.1em;color:#fff;text-shadow:0 4px 24px rgba(255,60,40,.6);opacity:0;transition:opacity .4s;}
  #wavesub{font-size:16px;letter-spacing:.3em;color:#ff6b5c;margin-top:6px;}
  #hpwrap{position:absolute;bottom:22px;left:22px;width:230px;}
  #hplabel{font-size:11px;letter-spacing:.2em;color:#c9c2ae;margin-bottom:5px;}
  #hpbar{height:20px;background:rgba(10,14,18,.8);border:2px solid rgba(255,255,255,.14);border-radius:4px;overflow:hidden;}
  #hpfill{height:100%;width:100%;background:linear-gradient(90deg,#ff3d2e,#ff7a4d);transition:width .18s;}
  #wpn{position:absolute;bottom:22px;right:22px;text-align:right;}
  #wpnname{font-size:13px;letter-spacing:.18em;color:#c9c2ae;}
  #wpnammo{font-size:34px;font-weight:700;line-height:1;margin-top:2px;}
  #wpnammo small{font-size:15px;color:#8a8574;}
  #wpnlist{display:flex;gap:6px;justify-content:flex-end;margin-top:8px;}
  .slot{font-size:10px;letter-spacing:.1em;padding:3px 7px;border-radius:4px;border:1px solid rgba(255,255,255,.12);
    color:#7a7565;background:rgba(10,14,18,.6);}
  .slot.on{color:#0a0c10;background:#ffd15c;border-color:#ffd15c;}
  .slot.empty{opacity:.35;text-decoration:line-through;}

  /* screens */
  .screen{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(20,10,10,.72),rgba(4,5,8,.96));backdrop-filter:blur(3px);
    cursor:default;overflow:auto;padding:20px;}
  .screen.hidden{display:none;}
  .panel{text-align:center;color:#e8e2d0;max-width:min(920px,94vw);padding:26px 24px;}
  .kick{font-size:12px;letter-spacing:.4em;color:#ff6b5c;}
  .panel h1{font-size:62px;letter-spacing:.06em;margin:4px 0 2px;text-shadow:0 6px 30px rgba(255,60,40,.5);}
  .panel h1 span{color:#ff4d3d;}
  .sect{font-size:12px;letter-spacing:.34em;color:#8f8b7a;margin:22px 0 12px;}
  .cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  .ccard{width:150px;background:rgba(14,18,24,.8);border:2px solid rgba(255,255,255,.1);border-radius:10px;
    padding:14px 12px;cursor:pointer;transition:.15s;text-align:left;}
  .ccard:hover{border-color:rgba(255,209,92,.6);transform:translateY(-3px);}
  .ccard.sel{border-color:#ffd15c;background:rgba(40,34,18,.7);}
  .avatar{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;margin-bottom:8px;}
  .avatar .hd{width:22px;height:22px;border-radius:3px;}
  .avatar .bd{width:34px;height:24px;border-radius:3px;margin-top:2px;}
  .avatar .lg{width:26px;height:10px;border-radius:2px;margin-top:2px;}
  .ccard .cn{font-size:14px;font-weight:700;letter-spacing:.08em;color:#fff;}
  .ccard .cd{font-size:10px;color:#9a927e;letter-spacing:.04em;margin:3px 0 8px;min-height:24px;}
  .barrow{display:flex;align-items:center;gap:6px;font-size:9px;color:#8f8b7a;letter-spacing:.1em;margin:3px 0;}
  .barrow .bar{flex:1;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;}
  .barrow .bar i{display:block;height:100%;border-radius:3px;}
  .perk{font-size:10px;color:#ffd15c;letter-spacing:.03em;margin-top:8px;line-height:1.4;}

  .mcard{width:190px;background:rgba(14,18,24,.8);border:2px solid rgba(255,255,255,.1);border-radius:10px;
    overflow:hidden;cursor:pointer;transition:.15s;text-align:left;}
  .mcard:hover{border-color:rgba(255,209,92,.6);transform:translateY(-3px);}
  .mcard.sel{border-color:#ffd15c;}
  .mthumb{height:74px;position:relative;}
  .mcard .mn{font-size:14px;font-weight:700;letter-spacing:.08em;color:#fff;padding:9px 12px 2px;}
  .mcard .md{font-size:10px;color:#9a927e;letter-spacing:.04em;padding:0 12px 12px;min-height:26px;}

  .keys{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-size:12px;color:#c9c2ae;
    margin:20px 0 6px;letter-spacing:.06em;}
  .keys kbd{background:#1a1f27;border:1px solid rgba(255,255,255,.15);border-bottom-width:3px;border-radius:5px;
    padding:2px 8px;color:#fff;font-family:inherit;font-size:11px;margin-right:3px;}
  .panel button{margin-top:18px;background:#ff4d3d;color:#fff;border:none;border-bottom:4px solid #b02a1e;
    border-radius:8px;padding:14px 40px;font-family:inherit;font-weight:700;font-size:16px;letter-spacing:.16em;cursor:pointer;}
  .panel button:hover{background:#ff6656;}
  .panel button:active{transform:translateY(2px);border-bottom-width:2px;}
  .panel button.ghost{background:transparent;border:2px solid rgba(255,255,255,.2);color:#c9c2ae;
    border-bottom-width:2px;padding:12px 26px;font-size:13px;margin-left:10px;}
  .panel button.ghost:hover{border-color:#fff;color:#fff;}
  .final{display:flex;gap:34px;justify-content:center;margin:22px 0 6px;}
  .final div span{display:block;font-size:12px;letter-spacing:.2em;color:#8a8574;}
  .final div b{font-size:40px;color:#ffd15c;}
  .muted{position:fixed;top:14px;right:14px;z-index:40;background:rgba(10,14,18,.72);
    border:1px solid rgba(255,255,255,.12);color:#c9c2ae;border-radius:6px;padding:6px 10px;
    font-family:inherit;font-size:11px;letter-spacing:.1em;cursor:pointer;}

<script>
'use strict';
/* =====================================================================
   BLOCKROT — 3D over-the-shoulder zombie survival (Boxhead-inspired).
   Three.js r128, fully procedural. Single file.
   ===================================================================== */

const ARENA=62, HALF=ARENA/2, WALL_H=3;
const CENTER=new THREE.Vector2(0,0);

  shotgun:{name:'SHOTGUN',key:'2', dmg:20, rof:0.72, spread:0.20, pellets:8, speed:78, tracer:0xffb24d, kick:9,  sound:'shotgun', base:24},

  rocket:{name:'ROCKET', key:'4', dmg:60, rof:0.95, spread:0, pellets:1, speed:52, tracer:0xff6a3d, kick:14, rocket:true, sound:'rocket', base:8},
};

// ------------------------------------------------------- audio
class SFX{
  constructor(){this.ctx=null;this.muted=false;}
  ensure(){if(!this.ctx){try{this.ctx=new (AudioContext||webkitAudioContext)();}catch(e){}}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();}
  tone(f,d,type,v,slide=0,delay=0){if(this.muted||!this.ctx)return;
    const t=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(this.ctx.destination);o.start(t);o.stop(t+d+.02);}
  noise(d,v,fq,slide=-600){if(this.muted||!this.ctx)return;
    const t=this.ctx.currentTime,n=this.ctx.sampleRate*d|0,buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate),data=buf.getChannelData(0);
    for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*(1-i/n);
    const src=this.ctx.createBufferSource();src.buffer=buf;
    const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(fq,t);
    f.frequency.exponentialRampToValueAtTime(Math.max(120,fq+slide),t+d);
    const g=this.ctx.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    src.connect(f).connect(g).connect(this.ctx.destination);src.start(t);}
  pistol(){this.tone(440,.08,'square',.18,-260);this.noise(.05,.2,2200);}
  shotgun(){this.noise(.22,.5,1600);this.tone(120,.18,'square',.25,-60);}
  smg(){this.tone(520,.05,'square',.12,-200);this.noise(.03,.14,2600);}
  rocket(){this.noise(.3,.35,900,400);this.tone(180,.3,'sawtooth',.2,120);}
  explode(){this.noise(.55,.7,1400,-1000);this.tone(70,.5,'sawtooth',.4,-30);}
  groan(){this.tone(90+Math.random()*40,.4,'sawtooth',.07,-30);}
  hurt(){this.tone(200,.16,'square',.3,-120);this.noise(.1,.2,900);}
  splat(){this.noise(.18,.28,700,-400);this.tone(120,.1,'triangle',.15,-60);}
  pickup(){this.tone(660,.08,'square',.2);this.tone(990,.1,'square',.2,0,.07);}
  wave(){[262,330,392,523].forEach((f,i)=>this.tone(f,.25,'square',.16,0,i*.1));}
  dry(){this.tone(140,.05,'square',.12,-40);}
  swap(){this.tone(300,.04,'square',.1);this.tone(500,.05,'square',.1,0,.04);}
}

// ------------------------------------------------------- shared assets
const G={}, M={};
function initAssets(){
  G.gib=new THREE.BoxGeometry(0.4,0.4,0.4);
  G.spark=new THREE.BoxGeometry(0.18,0.18,0.18);
  G.tracer=new THREE.BoxGeometry(0.16,0.16,1.6);
  G.blob=new THREE.CircleGeometry(1,16);
  M.blood=new THREE.MeshBasicMaterial({color:0x8b1a1a});
  M.spark=new THREE.MeshBasicMaterial({color:0xffce54});
  M.smoke=new THREE.MeshBasicMaterial({color:0x555555,transparent:true,opacity:.5});
  M.blob=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.28});
}
function box(w,h,d,color){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color,roughness:.85,metalness:.05,emissive:new THREE.Color(0x000000)}));}
function blob(r){const m=new THREE.Mesh(G.blob,M.blob);m.rotation.x=-Math.PI/2;m.scale.set(r,r,r);return m;}
function shade(hex,f){const c=new THREE.Color(hex);c.multiplyScalar(f);return c.getHex();}

// ------------------------------------------------------- collision world
let WALLS=[];
function clampArena(p,r){p.x=Math.max(-HALF+r,Math.min(HALF-r,p.x));p.z=Math.max(-HALF+r,Math.min(HALF-r,p.z));}
function pushWalls(p,r){
  for(const w of WALLS){
    const cx=Math.max(w.minx,Math.min(w.maxx,p.x)), cz=Math.max(w.minz,Math.min(w.maxz,p.z));
    let dx=p.x-cx, dz=p.z-cz, d=Math.hypot(dx,dz);
    if(d<r){
      if(d>0.0001){dx/=d;dz/=d;p.x=cx+dx*r;p.z=cz+dz*r;}
      else{const dl=p.x-w.minx,dr=w.maxx-p.x,dt=p.z-w.minz,db=w.maxz-p.z,m=Math.min(dl,dr,dt,db);
        if(m===dl)p.x=w.minx-r;else if(m===dr)p.x=w.maxx+r;else if(m===dt)p.z=w.minz-r;else p.z=w.maxz+r;}
    }
  }
}

// ------------------------------------------------------- player
class Player{
  constructor(scene,cfg){
    this.cfg=cfg; const c=cfg.colors, s=cfg.size;
    this.g=new THREE.Group();
    const body=box(1.5*s,1.5*s,1.0*s,c.body); body.position.y=1.55*s; this.g.add(body);
    const leg1=box(0.55*s,1.1*s,0.7*s,c.legs); leg1.position.set(-0.42*s,0.55*s,0); this.g.add(leg1);
    const leg2=box(0.55*s,1.1*s,0.7*s,c.legs); leg2.position.set( 0.42*s,0.55*s,0); this.g.add(leg2);
    const hd=box(1.05*s,1.05*s,1.05*s,c.head); hd.position.y=2.85*s; this.g.add(hd);
    const gun=box(0.35,0.35,1.6,0x232323); gun.position.set(0.5*s,1.6*s,0.95); this.g.add(gun);
    this.g.traverse(o=>{if(o.isMesh)o.castShadow=true;});
    this.g.add(blob(1.3*s));
    scene.add(this.g);
    this.radius=0.9*s; this.speed=cfg.speed; this.maxhp=cfg.hp; this.hp=cfg.hp;
    this.pos=new THREE.Vector3(0,0,0); this.hurtCd=0; this.headH=2.9*s;
  }
  dispose(scene){scene.remove(this.g);}
}

// ------------------------------------------------------- zombie
const ZTYPE={
  walker:{hp:60, speed:3.6, dmg:9, size:1.0, color:0x4c7a3a, score:100},
  runner:{hp:38, speed:7.4, dmg:7, size:0.8, color:0x8fae3a, score:150},
  brute:{hp:250, speed:2.4, dmg:22,size:1.6, color:0x2f6b4a, score:400},
};
class Zombie{
  constructor(scene,type,hpScale){
    const t=ZTYPE[type]; this.t=t; this.type=type; const s=t.size;
    this.g=new THREE.Group();
    const body=box(1.4*s,1.5*s,0.9*s,t.color); body.position.y=1.5*s; this.body=body;
    body.userData.zomb=true; this.g.add(body);
    const hd=box(1.0*s,1.0*s,1.0*s,shade(t.color,1.15)); hd.position.y=2.7*s; hd.userData.zomb=true; this.g.add(hd);
    const l1=box(0.5*s,1.0*s,0.6*s,shade(t.color,.8)); l1.position.set(-0.4*s,0.5*s,0); this.g.add(l1);
    const l2=box(0.5*s,1.0*s,0.6*s,shade(t.color,.8)); l2.position.set( 0.4*s,0.5*s,0); this.g.add(l2);
    const arm=box(1.0*s,0.32*s,0.32*s,shade(t.color,1.05)); arm.position.set(0,2.0*s,0.7*s); this.g.add(arm);
    const e1=box(0.16*s,0.16*s,0.05*s,0xff3020); e1.position.set(-0.24*s,2.75*s,0.5*s); this.g.add(e1);
    const e2=box(0.16*s,0.16*s,0.05*s,0xff3020); e2.position.set( 0.24*s,2.75*s,0.5*s); this.g.add(e2);
    this.g.traverse(o=>{if(o.isMesh)o.castShadow=true;});
    this.g.add(blob(1.1*s));
    scene.add(this.g);
    this.hitMesh=body;
    this.pos=new THREE.Vector3(); this.radius=0.75*s; this.hp=t.hp*hpScale; this.maxhp=this.hp;
    this.speed=t.speed*(0.9+Math.random()*0.2); this.atkCd=0; this.hitFlash=0; this.wob=Math.random()*6.28; this.dead=false;
    this.body.material.emissive=new THREE.Color(0x000000);
  }
  update(dt,player,zs){
    const dx=player.pos.x-this.pos.x, dz=player.pos.z-this.pos.z, d=Math.hypot(dx,dz)||1;
    let mx=dx/d, mz=dz/d, sx=0,sz=0;
    for(const z of zs){ if(z===this||z.dead)continue;
      const ox=this.pos.x-z.pos.x, oz=this.pos.z-z.pos.z, od=Math.hypot(ox,oz);
      if(od<(this.radius+z.radius)*1.3 && od>0){sx+=ox/od;sz+=oz/od;} }
    mx+=sx*0.6; mz+=sz*0.6; const ml=Math.hypot(mx,mz)||1; mx/=ml; mz/=ml;
    this.pos.x+=mx*this.speed*dt; this.pos.z+=mz*this.speed*dt;
    clampArena(this.pos,this.radius); pushWalls(this.pos,this.radius);
    this.g.position.set(this.pos.x,0,this.pos.z); this.g.rotation.y=Math.atan2(dx,dz);
    this.wob+=dt*this.speed*1.4; this.g.position.y=Math.abs(Math.sin(this.wob))*0.18;
    this.atkCd=Math.max(0,this.atkCd-dt);
    if(this.hitFlash>0){this.hitFlash-=dt*5;this.body.material.emissive.setScalar(Math.max(0,this.hitFlash)*0.8);}
  }
  hurt(n){this.hp-=n;this.hitFlash=1;return this.hp<=0;}
}

// ------------------------------------------------------- barrel / pickup
class Barrel{
  constructor(scene,x,z){
    this.g=new THREE.Group();
    const mesh=new THREE.Mesh(new THREE.CylinderGeometry(0.9,0.9,2.2,12),
      new THREE.MeshStandardMaterial({color:0xcc3322,roughness:.6,metalness:.3}));
    mesh.position.y=1.1; mesh.castShadow=true; mesh.userData.zomb=false; this.g.add(mesh);
    const stripe=new THREE.Mesh(new THREE.CylinderGeometry(0.92,0.92,0.35,12),
      new THREE.MeshStandardMaterial({color:0xf4d03f,roughness:.5}));
    stripe.position.y=1.1; this.g.add(stripe);
    this.g.position.set(x,0,z); scene.add(this.g);
    this.hitMesh=mesh; this.pos=new THREE.Vector3(x,0,z); this.radius=0.95; this.dead=false;
  }
}
class Pickup{
  constructor(scene,x,z,kind){
    this.kind=kind; this.g=new THREE.Group();
    const col=kind==='health'?0xff3d5a:0xffd15c;
    const base=box(0.9,0.9,0.9,col); base.position.y=0.7; base.castShadow=true; this.g.add(base);
    if(kind==='health'){
      const v=box(0.28,0.62,0.16,0xffffff); v.position.set(0,0.7,0.46); this.g.add(v);
      const h=box(0.62,0.28,0.16,0xffffff); h.position.set(0,0.7,0.46); this.g.add(h);
    }else{const b=box(0.5,0.3,0.16,0x2a2a2a); b.position.set(0,0.7,0.46); this.g.add(b);}
    this.g.position.set(x,0,z); scene.add(this.g);
    this.pos=new THREE.Vector3(x,0,z); this.radius=1.1; this.life=22; this.spin=Math.random()*6;
  }
  update(dt){this.spin+=dt*2;this.g.rotation.y=this.spin;this.g.position.y=Math.sin(this.spin*1.5)*0.15;this.life-=dt;}
}

// ------------------------------------------------------- game
class Game{
  constructor(){
    this.sfx=new SFX();
    this.setupThree(); initAssets();
    this.bullets=[];this.zombies=[];this.barrels=[];this.pickups=[];this.parts=[];this.explos=[];
    this.arenaObjs=[]; this.solids=[]; this.snow=null;
    this.keys={}; this.mouseDown=false; this.locked=false;
    this.yaw=0; this.pitch=0.42; this.sens=0.0022;
    this.ray=new THREE.Raycaster(); this.aimPoint=new THREE.Vector3(); this.aimOnZombie=false;
    this.state='menu'; this.time=0; this.shake=0;
    this.weapon='pistol'; this.ammo={}; this.fireCd=0;
    this.wave=0; this.score=0; this.kills=0; this.spawnQueue=[]; this.spawnTimer=0; this.betweenWaves=0; this.hpScale=1;
    this.selChar='soldier'; this.selMap='yard';
    this.player=null; this.char=null; this.map=null;
    this.tmpV=new THREE.Vector3();
    this.buildMenu(); this.bindInput(); this.bindUI();
    this.clock=new THREE.Clock();
    this.loop();
  }

  setupThree(){
    this.renderer=new THREE.WebGLRenderer({antialias:true});
    this.renderer.setSize(innerWidth,innerHeight);
    this.renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    this.renderer.shadowMap.enabled=true; this.renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    document.body.appendChild(this.renderer.domElement);
    this.canvas=this.renderer.domElement;
    this.scene=new THREE.Scene();
    this.camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,300);
    this.hemi=new THREE.HemisphereLight(0xffffff,0x444444,0.5); this.scene.add(this.hemi);
    this.dir=new THREE.DirectionalLight(0xffffff,0.9); this.dir.position.set(20,50,18); this.dir.castShadow=true;
    this.dir.shadow.mapSize.set(2048,2048);
    const s=HALF+6, sc=this.dir.shadow.camera; sc.left=-s;sc.right=s;sc.top=s;sc.bottom=-s;sc.near=1;sc.far=150;
    this.dir.shadow.bias=-0.0004; this.scene.add(this.dir);
    this.amb=new THREE.AmbientLight(0x404050,0.4); this.scene.add(this.amb);
    window.addEventListener('resize',()=>{this.camera.aspect=innerWidth/innerHeight;
      this.camera.updateProjectionMatrix();this.renderer.setSize(innerWidth,innerHeight);});
  }

  // ---------------- menu ----------------
  buildMenu(){
    const maxHP=175, maxSPD=18;
    charCards.innerHTML='';
    Object.entries(CHARACTERS).forEach(([id,c])=>{
      const col=c.colors;
      const d=document.createElement('div'); d.className='ccard'+(id===this.selChar?' sel':''); d.dataset.id=id;
      d.innerHTML=`<div class="avatar">
          <div class="hd" style="background:#${col.head.toString(16).padStart(6,'0')}"></div>
          <div class="bd" style="background:#${col.body.toString(16).padStart(6,'0')}"></div>
          <div class="lg" style="background:#${col.legs.toString(16).padStart(6,'0')}"></div></div>
        <div class="cn">${c.name}</div><div class="cd">${c.desc}</div>
        <div class="barrow">HP<div class="bar"><i style="width:${c.hp/maxHP*100}%;background:#ff5a4a"></i></div></div>
        <div class="barrow">SP<div class="bar"><i style="width:${c.speed/maxSPD*100}%;background:#5ab6ff"></i></div></div>
        <div class="perk">&#9656; ${c.perk}</div>`;
      d.onclick=()=>{this.selChar=id;[...charCards.children].forEach(x=>x.classList.toggle('sel',x.dataset.id===id));this.sfx.ensure();this.sfx.swap();};
      charCards.appendChild(d);
    });
    mapCards.innerHTML='';
    Object.entries(MAPS).forEach(([id,m])=>{
      const d=document.createElement('div'); d.className='mcard'+(id===this.selMap?' sel':''); d.dataset.id=id;
      const [a,b,c]=m.thumb;
      d.innerHTML=`<div class="mthumb" style="background:linear-gradient(160deg,${a} 40%,${b} 40%);">
          <div style="position:absolute;right:14px;bottom:12px;width:26px;height:26px;border-radius:4px;background:${c}"></div>
          <div style="position:absolute;left:14px;bottom:10px;width:16px;height:22px;border-radius:3px;background:${b};border:2px solid rgba(255,255,255,.25)"></div>
        </div><div class="mn">${m.name}</div><div class="md">${m.desc}</div>`;
      d.onclick=()=>{this.selMap=id;[...mapCards.children].forEach(x=>x.classList.toggle('sel',x.dataset.id===id));this.sfx.ensure();this.sfx.swap();};
      mapCards.appendChild(d);
    });
  }

  buildWeaponSlots(){
    wpnlist.innerHTML='';
    ORDER.forEach(id=>{const w=WEAPONS[id];const d=document.createElement('div');
      d.className='slot';d.id='slot_'+id;d.textContent=w.key+' '+w.name;wpnlist.appendChild(d);});
  }

  // ---------------- arena ----------------
  clearArena(){
    for(const o of this.arenaObjs)this.scene.remove(o);
    this.arenaObjs=[]; this.solids=[]; WALLS=[]; this.snow=null;
  }
  addArena(o){this.scene.add(o);this.arenaObjs.push(o);return o;}
  addSolid(x,z,w,d,h,mat){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    m.position.set(x,h/2,z);m.castShadow=true;m.receiveShadow=true;
    this.addArena(m); this.solids.push(m);
    WALLS.push({minx:x-w/2,maxx:x+w/2,minz:z-d/2,maxz:z+d/2}); return m;
  }
  buildArena(map){
    this.clearArena();
    this.scene.background=new THREE.Color(map.bg);
    this.scene.fog=new THREE.Fog(map.bg,map.fog[0],map.fog[1]);
    this.hemi.color.setHex(map.hemi[0]); this.hemi.groundColor.setHex(map.hemi[1]); this.hemi.intensity=map.hemi[2];
    this.dir.color.setHex(map.dir[0]); this.dir.intensity=map.dir[1];
    this.amb.color.setHex(map.amb[0]); this.amb.intensity=map.amb[1];

    const tex=this.groundTexture(map.ground);
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(ARENA,ARENA),
      new THREE.MeshStandardMaterial({map:tex,roughness:.95,metalness:0}));
    ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; this.ground=ground; this.addArena(ground);

    const wallMat=new THREE.MeshStandardMaterial({color:map.wallColor,roughness:.8});
    const t=1.2;
    this.addSolid(0,-HALF,ARENA,t,WALL_H,wallMat); this.addSolid(0,HALF,ARENA,t,WALL_H,wallMat);
    this.addSolid(-HALF,0,t,ARENA,WALL_H,wallMat); this.addSolid(HALF,0,t,ARENA,WALL_H,wallMat);

    const coverMat=new THREE.MeshStandardMaterial({color:map.coverColor,roughness:.9});
    for(const b of map.blocks) this.addSolid(b[0],b[1],b[2],b[3],2.4,coverMat);

    if(map.props==='grave')this.buildGraveProps();
    else if(map.props==='snow')this.buildSnowProps();
    if(map.weather==='snow')this.buildSnowfall();
  }

  groundTexture(style){
    const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
    if(style==='concrete'){
      x.fillStyle='#191d24';x.fillRect(0,0,512,512);const cell=64;
      for(let i=0;i<512;i+=cell)for(let j=0;j<512;j+=cell)if(((i/cell)+(j/cell))%2===0){x.fillStyle='#1e232b';x.fillRect(i,j,cell,cell);}
      x.strokeStyle='rgba(255,255,255,.04)';x.lineWidth=2;
      for(let i=0;i<=512;i+=cell){x.beginPath();x.moveTo(i,0);x.lineTo(i,512);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(512,i);x.stroke();}
    }else if(style==='grass'){
      x.fillStyle='#182315';x.fillRect(0,0,512,512);
      for(let k=0;k<2600;k++){const g=40+Math.random()*40;x.fillStyle=`rgb(${20+g*.3|0},${40+g|0},${18+g*.3|0})`;
        x.fillRect(Math.random()*512,Math.random()*512,2,2);}
      for(let k=0;k<30;k++){x.fillStyle='rgba(30,22,12,.5)';x.beginPath();x.arc(Math.random()*512,Math.random()*512,Math.random()*22+6,0,6.28);x.fill();}
    }else{ // snow
      x.fillStyle='#cfdcec';x.fillRect(0,0,512,512);
      for(let k=0;k<1600;k++){const b=Math.random()*30;x.fillStyle=`rgba(${180-b|0},${195-b|0},${215-b|0},.6)`;
        x.fillRect(Math.random()*512,Math.random()*512,3,3);}
      for(let k=0;k<40;k++){x.fillStyle='rgba(150,170,200,.35)';x.beginPath();x.arc(Math.random()*512,Math.random()*512,Math.random()*20+8,0,6.28);x.fill();}
      for(let k=0;k<120;k++){x.fillStyle='rgba(255,255,255,.9)';x.fillRect(Math.random()*512,Math.random()*512,2,2);}
    }
    const tex=new THREE.CanvasTexture(c);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(4,4);return tex;
  }

  buildGraveProps(){
    const stoneMat=new THREE.MeshStandardMaterial({color:0x8a8f96,roughness:.95});
    const graves=[[-8,-14],[-4,-14],[0,-14],[6,-16],[10,-14],[14,-10],
      [-14,4],[-14,8],[-14,12],[12,6],[16,2],[8,14],[-2,16],[4,16]];
    for(const [gx,gz] of graves){
      const stone=box(1.0,1.4,0.28,0x8a8f96); stone.position.set(gx,0.7,gz); stone.castShadow=true;
      this.addArena(stone);
      const cw=box(0.24,0.7,0.24,0x9aa0a6); cw.position.set(gx,1.7,gz); this.addArena(cw);
      const ch=box(0.7,0.24,0.24,0x9aa0a6); ch.position.set(gx,1.6,gz); this.addArena(ch);
      WALLS.push({minx:gx-0.6,maxx:gx+0.6,minz:gz-0.4,maxz:gz+0.4}); // low cover collider
    }
    // church backdrop (collider wall + gable + cross) near +z edge
    const churchMat=new THREE.MeshStandardMaterial({color:0x3a3f38,roughness:.9});
    this.addSolid(0,HALF-6,16,2,7,churchMat);
    const gable=new THREE.Mesh(new THREE.ConeGeometry(9,5,4),churchMat);
    gable.position.set(0,9,HALF-6); gable.rotation.y=Math.PI/4; gable.castShadow=true; this.addArena(gable);
    const cv=box(0.5,3,0.5,0xb8bcc0); cv.position.set(0,12.5,HALF-6); this.addArena(cv);
    const cvh=box(1.8,0.5,0.5,0xb8bcc0); cvh.position.set(0,12.4,HALF-6); this.addArena(cvh);
    // dead trees
    for(const [tx,tz] of [[-18,-18],[18,16],[-20,14]]){
      const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.55,5,7),
        new THREE.MeshStandardMaterial({color:0x2a211a,roughness:1}));
      trunk.position.set(tx,2.5,tz); trunk.castShadow=true; this.addArena(trunk);
      for(let i=0;i<4;i++){const br=box(0.25,0.25,2.2,0x2a211a);
        br.position.set(tx,4+i*.4,tz); br.rotation.y=i*1.3; br.rotation.z=0.5; this.addArena(br);}
      WALLS.push({minx:tx-0.6,maxx:tx+0.6,minz:tz-0.6,maxz:tz+0.6});
    }
  }

  buildSnowProps(){
    // pine trees
    const trunkMat=new THREE.MeshStandardMaterial({color:0x3a2a1e,roughness:1});
    const pineMat=new THREE.MeshStandardMaterial({color:0x2f5540,roughness:.9});
    for(const [tx,tz] of [[-18,-16],[17,15],[-20,12],[19,-18],[0,18]]){
      const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.5,2,7),trunkMat);
      tr.position.set(tx,1,tz); tr.castShadow=true; this.addArena(tr);
      for(let i=0;i<3;i++){const cone=new THREE.Mesh(new THREE.ConeGeometry(2.4-i*0.6,2.2,8),pineMat);
        cone.position.set(tx,2.4+i*1.5,tz); cone.castShadow=true; this.addArena(cone);
        const snowCap=new THREE.Mesh(new THREE.ConeGeometry(2.4-i*0.6+.05,0.5,8),
          new THREE.MeshStandardMaterial({color:0xffffff,roughness:.7}));
        snowCap.position.set(tx,3.3+i*1.5,tz); this.addArena(snowCap);}
      WALLS.push({minx:tx-0.7,maxx:tx+0.7,minz:tz-0.7,maxz:tz+0.7});
    }
    // wrecked car
    const carMat=new THREE.MeshStandardMaterial({color:0x77343a,roughness:.7,metalness:.3});
    const body=box(5,1.4,2.4,0x77343a); body.position.set(14,0.9,-6); body.castShadow=true; this.addArena(body);
    const cab=box(2.6,1.2,2.2,0x5a262b); cab.position.set(14.3,1.9,-6); cab.castShadow=true; this.addArena(cab);
    const snowTop=box(5.2,0.3,2.6,0xffffff); snowTop.position.set(14,2.6,-6); this.addArena(snowTop);
    WALLS.push({minx:11,maxx:17,minz:-7.4,maxz:-4.6});
    // crates with snow
    const crateMat=new THREE.MeshStandardMaterial({color:0x6b5334,roughness:.95});
    for(const [cx,cz] of [[-10,8],[-8,8],[-9,10]]){
      const cr=new THREE.Mesh(new THREE.BoxGeometry(2,2,2),crateMat);
      cr.position.set(cx,1,cz);cr.castShadow=true;this.addArena(cr);
      const cap=box(2.1,0.25,2.1,0xffffff);cap.position.set(cx,2.1,cz);this.addArena(cap);
      WALLS.push({minx:cx-1,maxx:cx+1,minz:cz-1,maxz:cz+1});
    }
  }

  buildSnowfall(){
    const cnt=380, arr=new Float32Array(cnt*3);
    for(let i=0;i<cnt;i++){arr[i*3]=(Math.random()-.5)*ARENA;arr[i*3+1]=Math.random()*34;arr[i*3+2]=(Math.random()-.5)*ARENA;}
    const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(arr,3));
    const mat=new THREE.PointsMaterial({color:0xffffff,size:0.45,transparent:true,opacity:.85,depthWrite:false});
    const pts=new THREE.Points(geo,mat); this.addArena(pts);
    this.snow={arr,geo,cnt};
  }

  spawnBarrels(){for(const [x,z] of this.map.barrels)this.barrels.push(new Barrel(this.scene,x,z));}

  // ---------------- input ----------------
  bindInput(){
    addEventListener('keydown',e=>{
      const k=e.key.toLowerCase(); this.keys[k]=true;
      if(this.state==='play'){
        if(k>='1'&&k<='4'){this.switchWeapon(ORDER[+k-1]);}
        if(k==='escape')return; // handled by pointerlock
        if(k==='p')this.pause();
      }
    });
    addEventListener('keyup',e=>{this.keys[e.key.toLowerCase()]=false;});
    addEventListener('mousemove',e=>{
      if(this.locked && this.state==='play'){
        this.yaw-=e.movementX*this.sens;
        this.pitch=Math.max(-0.2,Math.min(0.95,this.pitch+e.movementY*this.sens));
      }
    });
    this.canvas.addEventListener('mousedown',()=>{
      this.sfx.ensure();
      if(this.state==='play'){ if(this.locked)this.mouseDown=true; else this.requestLock(); }
    });
    addEventListener('mouseup',()=>{this.mouseDown=false;});
    addEventListener('wheel',e=>{
      if(this.state!=='play')return; e.preventDefault();
      const dir=e.deltaY>0?1:-1; let i=ORDER.indexOf(this.weapon);
      i=(i+dir+ORDER.length)%ORDER.length; this.switchWeapon(ORDER[i]);
    },{passive:false});
    document.addEventListener('pointerlockchange',()=>{
      this.locked=document.pointerLockElement===this.canvas;
      if(!this.locked && this.state==='play')this.pause();
    });
  }
  requestLock(){ if(this.canvas.requestPointerLock)this.canvas.requestPointerLock(); }

  bindUI(){
    btnDeploy.onclick=()=>this.start();
    btnRetry.onclick=()=>this.start();
    btnMenu.onclick=()=>this.toMenu();
    btnQuit.onclick=()=>this.toMenu();
    btnResume.onclick=()=>this.resume();
    btnMute.onclick=()=>{this.sfx.ensure();this.sfx.muted=!this.sfx.muted;
      btnMute.textContent='SOUND: '+(this.sfx.muted?'OFF':'ON');};
    this.buildWeaponSlots();
  }

  // ---------------- flow ----------------
  start(){
    // clear entities
    for(const z of this.zombies)this.scene.remove(z.g);
    for(const b of this.bullets)this.scene.remove(b.mesh);
    for(const p of this.pickups)this.scene.remove(p.g);
    for(const p of this.parts)this.scene.remove(p.mesh);
    for(const b of this.barrels)this.scene.remove(b.g);
    for(const e of this.explos)this.scene.remove(e.mesh);
    this.zombies=[];this.bullets=[];this.pickups=[];this.parts=[];this.explos=[];this.barrels=[];

    this.char=CHARACTERS[this.selChar]; this.map=MAPS[this.selMap];
    this.buildArena(this.map);
    if(this.player)this.player.dispose(this.scene);
    this.player=new Player(this.scene,this.char);
    this.player.pos.set(0,0,0);
    this.spawnBarrels();

    // ammo = base + character bonus
    this.ammo={};
    for(const id of ORDER){ const w=WEAPONS[id];
      this.ammo[id]=w.infinite?Infinity:(w.base+((this.char.ammo&&this.char.ammo[id])||0)); }
    this.wave=0;this.score=0;this.kills=0;this.hpScale=1;
    this.yaw=0;this.pitch=0.42;
    this.switchWeapon('pistol');

    menuScreen.classList.add('hidden');overScreen.classList.add('hidden');pauseScreen.classList.add('hidden');
    hud.classList.add('show'); reticle.classList.add('show');
    this.sfx.ensure(); this.state='play'; this.requestLock();
    this.clock.getDelta();
    this.nextWave();
  }
  pause(){ if(this.state!=='play')return; this.state='pause'; this.mouseDown=false;
    pauseScreen.classList.remove('hidden'); if(document.exitPointerLock)document.exitPointerLock(); }
  resume(){ this.state='play'; pauseScreen.classList.add('hidden'); this.requestLock(); this.clock.getDelta(); }
  toMenu(){ this.state='menu'; this.mouseDown=false;
    overScreen.classList.add('hidden');pauseScreen.classList.add('hidden');
    hud.classList.remove('show'); reticle.classList.remove('show');
    menuScreen.classList.remove('hidden'); if(document.exitPointerLock)document.exitPointerLock(); }
  gameOver(){ this.state='over'; this.mouseDown=false;
    fWave.textContent=this.wave;fKills.textContent=this.kills;fScore.textContent=this.score;
    hud.classList.remove('show'); reticle.classList.remove('show');
    overScreen.classList.remove('hidden'); if(document.exitPointerLock)document.exitPointerLock(); }

  nextWave(){
    this.wave++; this.hpScale=1+(this.wave-1)*0.16; this.sfx.wave();
    const q=[], n=4+Math.floor(this.wave*2.4);
    for(let i=0;i<n;i++){let type='walker';
      if(this.wave>=3&&Math.random()<0.28)type='runner';
      if(this.wave>=5&&Math.random()<0.14)type='brute';
      q.push(type);}
    this.spawnQueue=q; this.spawnTimer=0;
    banner('WAVE '+this.wave,this.wave===1?'GET READY':'INCOMING'); this.updateHUD();
  }
  switchWeapon(id){ if(!WEAPONS[id])return;
    if(id!==this.weapon)this.sfx.swap();
    this.weapon=id; this.fireCd=Math.max(this.fireCd,0);
    ORDER.forEach(w=>{const el=document.getElementById('slot_'+w);
      el.classList.toggle('on',w===id);
      el.classList.toggle('empty',w!=='pistol'&&this.ammo[w]<=0);});
    this.updateHUD();
  }

  // ---------------- firing ----------------
  muzzle(){
    const fx=Math.sin(this.yaw), fz=Math.cos(this.yaw), rx=Math.cos(this.yaw), rz=-Math.sin(this.yaw);
    return this.tmpV.set(this.player.pos.x+fx*1.2+rx*0.4, 1.6, this.player.pos.z+fz*1.2+rz*0.4);
  }
  fire(){
    const w=WEAPONS[this.weapon];
    if(!w.infinite && this.ammo[this.weapon]<=0){ this.sfx.dry(); this.switchWeapon('pistol'); return; }
    const mz=this.muzzle().clone();
    let dx=this.aimPoint.x-mz.x, dz=this.aimPoint.z-mz.z; const dl=Math.hypot(dx,dz)||1; dx/=dl; dz/=dl;
    const baseAng=Math.atan2(dx,dz), dmg=w.dmg*this.char.dmgMult;
    for(let i=0;i<w.pellets;i++){
      const ang=baseAng+(Math.random()-0.5)*w.spread*2;
      const dir=new THREE.Vector3(Math.sin(ang),0,Math.cos(ang));
      this.spawnBullet(mz.x+dir.x*0.6,mz.z+dir.z*0.6,dir,w,dmg);
    }
    if(!w.infinite)this.ammo[this.weapon]--;
    this.fireCd=w.rof*this.char.fireMult;
    this.shake=Math.max(this.shake,w.kick*0.05);
    this.muzzleFlash(mz,w);
    this.sfx[w.sound]();
    if(!w.infinite&&this.ammo[this.weapon]<=0)this.switchWeapon(this.weapon);
    this.updateHUD();
  }
  spawnBullet(x,z,dir,w,dmg){
    const mesh=new THREE.Mesh(w.rocket?new THREE.BoxGeometry(0.4,0.4,0.9):G.tracer,
      new THREE.MeshBasicMaterial({color:w.tracer}));
    mesh.position.set(x,1.5,z); mesh.rotation.y=Math.atan2(dir.x,dir.z); this.scene.add(mesh);
    this.bullets.push({mesh,dir:dir.clone(),speed:w.speed,dmg,life:1.4,rocket:!!w.rocket});
  }
  muzzleFlash(mz,w){
    const fl=new THREE.PointLight(w.tracer,3,10); fl.position.set(mz.x,1.6,mz.z); this.scene.add(fl);
    setTimeout(()=>this.scene.remove(fl),50);
    for(let i=0;i<4;i++){const s=new THREE.Mesh(G.spark,M.spark); s.position.set(mz.x,1.6,mz.z);
      const a=this.yaw+(Math.random()-.5)*0.5, sp=8+Math.random()*8;
      this.parts.push({mesh:s,vx:Math.sin(a)*sp,vy:Math.random()*4,vz:Math.cos(a)*sp,life:.2,grav:false});
      this.scene.add(s);}
  }

  explode(x,z,radius,dmg){
    this.sfx.explode(); this.shake=Math.max(this.shake,1.4);
    const light=new THREE.PointLight(0xff8030,6,radius*4); light.position.set(x,2,z); this.scene.add(light);
    setTimeout(()=>this.scene.remove(light),120);
    const ball=new THREE.Mesh(new THREE.SphereGeometry(1,10,10),
      new THREE.MeshBasicMaterial({color:0xffaa33,transparent:true,opacity:.9}));
    ball.position.set(x,1.5,z); this.scene.add(ball); this.explos.push({mesh:ball,r:radius,t:0});
    for(let i=0;i<16;i++){const s=new THREE.Mesh(G.gib,i%2?M.smoke.clone():M.spark); s.position.set(x,1.5,z);
      const a=Math.random()*6.28, sp=6+Math.random()*14;
      this.parts.push({mesh:s,vx:Math.cos(a)*sp,vy:Math.random()*10,vz:Math.sin(a)*sp,life:.6,grav:true});
      this.scene.add(s);}
    for(const zb of this.zombies){ if(zb.dead)continue;
      const d=Math.hypot(zb.pos.x-x,zb.pos.z-z); if(d<radius){if(zb.hurt(dmg*(1-d/radius)))this.killZombie(zb);} }
    for(const b of this.barrels){ if(b.dead)continue; if(Math.hypot(b.pos.x-x,b.pos.z-z)<radius)this.popBarrel(b); }
    const pd=Math.hypot(this.player.pos.x-x,this.player.pos.z-z); if(pd<radius)this.damagePlayer((1-pd/radius)*30);
  }
  popBarrel(b){ if(b.dead)return; b.dead=true; this.scene.remove(b.g);
    setTimeout(()=>this.explode(b.pos.x,b.pos.z,7,90),40); }

  killZombie(z){ if(z.dead)return; z.dead=true; this.kills++; this.score+=z.t.score; this.sfx.splat();
    this.gib(z.pos,z.t.color,z.t.size); this.scene.remove(z.g);
    const roll=Math.random();
    if(roll<0.09)this.pickups.push(new Pickup(this.scene,z.pos.x,z.pos.z,'health'));
    else if(roll<0.24)this.pickups.push(new Pickup(this.scene,z.pos.x,z.pos.z,'ammo'));
    this.updateHUD();
  }
  gib(pos,color,size){
    const mat=new THREE.MeshBasicMaterial({color});
    for(let i=0;i<10;i++){const m=new THREE.Mesh(G.gib,Math.random()<.5?mat:M.blood);
      m.position.set(pos.x,1.4,pos.z);m.scale.setScalar((0.6+Math.random())*size);
      const a=Math.random()*6.28,sp=5+Math.random()*11;
      this.parts.push({mesh:m,vx:Math.cos(a)*sp,vy:4+Math.random()*8,vz:Math.sin(a)*sp,life:.9,grav:true,spin:Math.random()*10});
      this.scene.add(m);}
  }
  bloodPuff(pos,color){
    for(let i=0;i<4;i++){const m=new THREE.Mesh(G.spark,M.blood);m.position.copy(pos);
      const a=Math.random()*6.28,sp=3+Math.random()*5;
      this.parts.push({mesh:m,vx:Math.cos(a)*sp,vy:Math.random()*4,vz:Math.sin(a)*sp,life:.3,grav:true});
      this.scene.add(m);}
  }
  damagePlayer(n){
    if(this.player.hurtCd>0)return; n*=this.char.resist;
    this.player.hp-=n; this.player.hurtCd=0.35; this.sfx.hurt(); this.shake=Math.max(this.shake,0.5);
    document.body.style.boxShadow='inset 0 0 160px rgba(255,0,0,.55)';
    setTimeout(()=>document.body.style.boxShadow='',120); this.updateHUD();
    if(this.player.hp<=0){this.player.hp=0;this.updateHUD();this.gameOver();}
  }

  // ---------------- camera + aim ----------------
  updateCamera(dt){
    const cp=Math.cos(this.pitch), sp=Math.sin(this.pitch);
    const fwd=this.tmpV.set(Math.sin(this.yaw)*cp,-sp,Math.cos(this.yaw)*cp);
    const rx=Math.cos(this.yaw), rz=-Math.sin(this.yaw);
    const px=this.player.pos.x+rx*1.1, py=this.player.headH, pz=this.player.pos.z+rz*1.1;
    const dist=6.8;
    let cx=px-fwd.x*dist, cy=py-fwd.y*dist, cz=pz-fwd.z*dist;
    // camera collision vs solids
    const origin=new THREE.Vector3(px,py,pz);
    const toCam=new THREE.Vector3(cx-px,cy-py,cz-pz); const len=toCam.length(); toCam.normalize();
    this.ray.set(origin,toCam); this.ray.far=len;
    const hits=this.ray.intersectObjects(this.solids,false);
    if(hits.length){const h=hits[0].distance-0.4; cx=px+toCam.x*h; cy=py+toCam.y*h; cz=pz+toCam.z*h;}
    if(cy<1.2)cy=1.2;
    this.camera.position.set(cx+(Math.random()-.5)*this.shake*2, cy+(Math.random()-.5)*this.shake*2, cz);
    this.camera.lookAt(px+fwd.x*8, py+fwd.y*8, pz+fwd.z*8);
    // aim from screen center
    this.ray.setFromCamera(CENTER,this.camera); this.ray.far=200;
    const list=[this.ground]; for(const s of this.solids)list.push(s);
    for(const z of this.zombies)list.push(z.hitMesh);
    for(const b of this.barrels)if(!b.dead)list.push(b.hitMesh);
    const ah=this.ray.intersectObjects(list,false);
    if(ah.length){this.aimPoint.copy(ah[0].point);this.aimOnZombie=!!ah[0].object.userData.zomb;}
    else{this.aimPoint.copy(this.ray.ray.origin).addScaledVector(this.ray.ray.direction,60);this.aimOnZombie=false;}
    reticle.classList.toggle('hot',this.aimOnZombie);
  }

  // ---------------- update ----------------
  update(dt){
    this.time+=dt;
    const p=this.player;
    // movement relative to yaw
    const fx=Math.sin(this.yaw), fz=Math.cos(this.yaw), rx=Math.cos(this.yaw), rz=-Math.sin(this.yaw);
    let mx=0,mz=0;
    if(this.keys['w']||this.keys['arrowup']){mx+=fx;mz+=fz;}
    if(this.keys['s']||this.keys['arrowdown']){mx-=fx;mz-=fz;}
    if(this.keys['d']||this.keys['arrowright']){mx+=rx;mz+=rz;}
    if(this.keys['a']||this.keys['arrowleft']){mx-=rx;mz-=rz;}
    const ml=Math.hypot(mx,mz);
    if(ml>0){mx/=ml;mz/=ml;
      const sprint=(this.keys['shift'])?1.5:1;
      p.pos.x+=mx*p.speed*sprint*dt; p.pos.z+=mz*p.speed*sprint*dt;
      clampArena(p.pos,p.radius); pushWalls(p.pos,p.radius);}
    for(const b of this.barrels){ if(b.dead)continue;
      const ddx=p.pos.x-b.pos.x, ddz=p.pos.z-b.pos.z, d=Math.hypot(ddx,ddz), rr=p.radius+b.radius;
      if(d<rr&&d>0){p.pos.x=b.pos.x+ddx/d*rr;p.pos.z=b.pos.z+ddz/d*rr;} }
    p.hurtCd=Math.max(0,p.hurtCd-dt);
    p.g.position.set(p.pos.x,0,p.pos.z); p.g.rotation.y=this.yaw;

    this.updateCamera(dt);

    this.fireCd-=dt;
    if(this.mouseDown&&this.locked&&this.fireCd<=0)this.fire();

    // spawns
    if(this.spawnQueue.length){
      this.spawnTimer-=dt;
      if(this.spawnTimer<=0&&this.zombies.length<46){this.spawnTimer=Math.max(0.18,0.6-this.wave*0.02);this.spawnZombie(this.spawnQueue.pop());}
    } else if(this.zombies.length===0){
      if(this.betweenWaves<=0){this.betweenWaves=3.2;this.ammo.shotgun+=6;this.ammo.smg+=40;this.ammo.rocket+=2;this.updateHUD();}
      this.betweenWaves-=dt; if(this.betweenWaves<=0){this.betweenWaves=0;this.nextWave();}
    }

    for(const z of this.zombies){ z.update(dt,p,this.zombies);
      const d=Math.hypot(z.pos.x-p.pos.x,z.pos.z-p.pos.z);
      if(d<z.radius+p.radius&&z.atkCd<=0){z.atkCd=0.6;this.damagePlayer(z.t.dmg);} }
    this.zombies=this.zombies.filter(z=>!z.dead);

    for(const b of this.bullets){
      const step=b.speed*dt; b.mesh.position.x+=b.dir.x*step; b.mesh.position.z+=b.dir.z*step; b.life-=dt;
      let dead=b.life<=0;
      if(!b.rocket)b.mesh.scale.z=Math.min(3,b.speed*0.04);
      if(Math.abs(b.mesh.position.x)>HALF||Math.abs(b.mesh.position.z)>HALF)dead=true;
      if(!dead)for(const w of WALLS){if(b.mesh.position.x>w.minx&&b.mesh.position.x<w.maxx&&b.mesh.position.z>w.minz&&b.mesh.position.z<w.maxz){dead=true;break;}}
      if(!dead)for(const z of this.zombies){ if(z.dead)continue;
        if(Math.hypot(z.pos.x-b.mesh.position.x,z.pos.z-b.mesh.position.z)<z.radius+0.4){
          if(b.rocket)this.explode(b.mesh.position.x,b.mesh.position.z,7,WEAPONS.rocket.dmg*1.4*this.char.dmgMult);
          else{if(z.hurt(b.dmg))this.killZombie(z);else this.bloodPuff(b.mesh.position,z.t.color);}
          dead=true;break;} }
      if(!dead)for(const bar of this.barrels){ if(bar.dead)continue;
        if(Math.hypot(bar.pos.x-b.mesh.position.x,bar.pos.z-b.mesh.position.z)<bar.radius+0.4){
          if(b.rocket)this.explode(b.mesh.position.x,b.mesh.position.z,7,WEAPONS.rocket.dmg*this.char.dmgMult);
          else this.popBarrel(bar); dead=true;break;} }
      if(dead){ if(b.rocket&&b.life<=0)this.explode(b.mesh.position.x,b.mesh.position.z,6,WEAPONS.rocket.dmg*this.char.dmgMult);
        this.scene.remove(b.mesh); b._d=true; }
    }
    this.bullets=this.bullets.filter(b=>!b._d);

    for(const pk of this.pickups){ pk.update(dt);
      if(Math.hypot(pk.pos.x-p.pos.x,pk.pos.z-p.pos.z)<pk.radius+p.radius){ this.sfx.pickup();
        if(pk.kind==='health')p.hp=Math.min(p.maxhp,p.hp+30);
        else{this.ammo.shotgun+=6;this.ammo.smg+=40;this.ammo.rocket+=1;}
        pk.life=-1;this.scene.remove(pk.g);this.updateHUD();}
      if(pk.life<=0){pk._d=true;this.scene.remove(pk.g);} }
    this.pickups=this.pickups.filter(pk=>!pk._d);

    for(const pt of this.parts){
      pt.mesh.position.x+=pt.vx*dt;pt.mesh.position.y+=pt.vy*dt;pt.mesh.position.z+=pt.vz*dt;
      if(pt.grav){pt.vy-=26*dt;if(pt.mesh.position.y<0.2){pt.mesh.position.y=0.2;pt.vy*=-0.35;pt.vx*=.7;pt.vz*=.7;}}
      if(pt.spin){pt.mesh.rotation.x+=pt.spin*dt;pt.mesh.rotation.y+=pt.spin*dt;}
      pt.life-=dt;
      if(pt.mesh.material.transparent&&pt.mesh.material.opacity!==undefined)pt.mesh.material.opacity=Math.max(0,pt.life);
      if(pt.life<=0){pt._d=true;this.scene.remove(pt.mesh);}
    }
    this.parts=this.parts.filter(pt=>!pt._d);

    for(const ex of this.explos){ ex.t+=dt; const k=ex.t/0.4;
      ex.mesh.scale.setScalar(1+k*ex.r); ex.mesh.material.opacity=Math.max(0,0.9-k);
      if(k>=1){ex._d=true;this.scene.remove(ex.mesh);} }
    this.explos=this.explos.filter(e=>!e._d);

    if(this.snow){ const a=this.snow.arr;
      for(let i=0;i<this.snow.cnt;i++){ a[i*3+1]-=7*dt; a[i*3]+=Math.sin(this.time+i)*0.3*dt;
        if(a[i*3+1]<0){a[i*3+1]=34;a[i*3]=(Math.random()-.5)*ARENA;a[i*3+2]=(Math.random()-.5)*ARENA;} }
      this.snow.geo.attributes.position.needsUpdate=true; }

    this.shake*=Math.pow(0.0008,dt); if(this.shake<0.01)this.shake=0;
    sLeft.textContent=this.zombies.length+this.spawnQueue.length;
  }

  spawnZombie(type){
    const z=new Zombie(this.scene,type,this.hpScale); let x,zz,tries=0;
    do{const side=Math.floor(Math.random()*4),o=(Math.random()-0.5)*(ARENA-6);
      if(side===0){x=o;zz=-HALF+2;}else if(side===1){x=o;zz=HALF-2;}
      else if(side===2){x=-HALF+2;zz=o;}else{x=HALF-2;zz=o;} tries++;
    }while(Math.hypot(x-this.player.pos.x,zz-this.player.pos.z)<14&&tries<10);
    z.pos.set(x,0,zz); z.g.position.set(x,0,zz);
    if(Math.random()<0.3)this.sfx.groan(); this.zombies.push(z);
  }

  updateHUD(){
    sWave.textContent=this.wave;sScore.textContent=this.score;sKills.textContent=this.kills;
    hpfill.style.width=Math.max(0,this.player.hp/this.player.maxhp*100)+'%';
    const w=WEAPONS[this.weapon];wpnname.textContent=w.name;
    if(w.infinite)wpnammo.innerHTML='&#8734;'; else wpnammo.innerHTML=this.ammo[this.weapon]+'<small> rds</small>';
    ORDER.forEach(id=>{const el=document.getElementById('slot_'+id);
      if(el)el.classList.toggle('empty',id!=='pistol'&&this.ammo[id]<=0);});
  }

  loop(){ requestAnimationFrame(()=>this.loop());
    const dt=Math.min(0.05,this.clock.getDelta());
    if(this.state==='play')this.update(dt);
    this.renderer.render(this.scene,this.camera);
  }
}

let bannerTimer=null;
function banner(text,sub){
  const b=document.getElementById('wavebanner');
  b.childNodes[0].nodeValue=text;document.getElementById('wavesub').textContent=sub;
  b.style.opacity=1;clearTimeout(bannerTimer);bannerTimer=setTimeout(()=>b.style.opacity=0,1600);
}

window.addEventListener('DOMContentLoaded',()=>{window.game=new Game();});
</script>
